name: Validate class schedule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, catches bad data entered from the admin page (the schedule lives in Firebase)
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-data.mjs
