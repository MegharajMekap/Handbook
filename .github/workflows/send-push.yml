name: Send push notifications

on:
  schedule:
    # Announcements / events, plus class reminders (15 min before, 5 min before, start, 5 min after).
    # GitHub runs schedules on a best-effort basis: every 5 minutes is the fastest allowed, and runs
    # are often delayed, so a reminder can arrive a few minutes late.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency: send-push

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin@13
      - run: node scripts/send-push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ vars.SITE_URL }}
